name: Audit cancelled quality runs

on:
  workflow_run:
    workflows: ["Airdox Quality Gate & Windows Build"]
    types: [completed]

permissions:
  actions: read

jobs:
  cancellation:
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { writeFileSync } = require('node:fs')
            const run = context.payload.workflow_run
            const params = { ...context.repo, run_id: run.id }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, params)
            const prNumber = run.pull_requests?.[0]?.number
            const successor = prNumber === undefined ? null : await github.rest.actions
              .listWorkflowRuns({ ...context.repo, workflow_id: run.workflow_id, event: 'pull_request', per_page: 50 })
              .then(({ data }) => data.workflow_runs
                .filter((other) => other.id !== run.id && other.pull_requests?.some((pr) => pr.number === prNumber)
                  && other.created_at > run.created_at && other.created_at <= run.updated_at)
                .sort((a, b) => a.created_at.localeCompare(b.created_at))[0] ?? null)
            const evidence = {
              runId: run.id, attempt: run.run_attempt, commit: run.head_sha, event: run.event,
              branch: run.head_branch, url: run.html_url, createdAt: run.created_at, endedAt: run.updated_at,
              reason: successor ? 'consistent with replacement by newer pull request run' : 'initiator unknown',
              possibleSuccessor: successor && { runId: successor.id, commit: successor.head_sha, url: successor.html_url },
              cancelledJobs: jobs.filter((job) => job.conclusion === 'cancelled').map((job) => ({
                id: job.id, name: job.name, endedAt: job.completed_at,
                steps: (job.steps || []).filter((step) => step.conclusion === 'cancelled').map((step) => step.name),
              })),
            }
            writeFileSync('quality-cancellation.json', JSON.stringify(evidence, null, 2))
            core.info(JSON.stringify(evidence))
      - uses: actions/upload-artifact@v4
        with:
          name: quality-cancellation
          path: quality-cancellation.json
          if-no-files-found: error
