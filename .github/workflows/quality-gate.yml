name: Airdox Quality Gate & Windows Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-static:
    name: Build and static checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run build
      - run: ruff check backend tests scripts
      - run: ruff check --select S backend
      - run: npm audit --omit=dev --audit-level=critical
      - run: python -m pytest -q tests/test_quality_gate.py tests/test_quality_workflow.py
      - run: python scripts/quality_gate.py record static
      - uses: actions/upload-artifact@v4
        with:
          name: stage-static
          path: reports/
          if-no-files-found: error
          overwrite: true

  unit-and-branch-tests:
    name: Python, React and Electron tests
    needs: build-and-static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Python unit tests and branch coverage
        env:
          COVERAGE_FILE: reports/coverage-python/coverage-data
        run: |
          New-Item -ItemType Directory -Force reports/coverage-python | Out-Null
          python -m pytest --cov=backend --cov-branch --cov-context=test --cov-fail-under=90 `
            --cov-report=term-missing --cov-report=html:reports/coverage-python/html `
            --cov-report=json:reports/coverage-python/coverage.json --junitxml=reports/pytest-junit.xml `
            -k "not test_production_snapshot_leaves_master_and_sidecars_byte_identical" `
            tests/test_backend_coverage.py tests/test_quality_critical_paths.py tests/test_filter_groups.py `
            tests/test_backend_mutation_contracts.py tests/test_python_mutation_runner.py `
            tests/test_live.py tests/test_rekordbox_playback.py tests/test_readonly.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality_gate.py collect-python-arcs $env:COVERAGE_FILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality_gate.py seal python
      - name: React and TypeScript coverage
        if: ${{ !cancelled() }}
        run: |
          npm run test:frontend -- --reporter=default --reporter=junit --outputFile.junit=reports/frontend-junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality_gate.py seal frontend
      - name: Electron coverage
        if: ${{ !cancelled() }}
        run: |
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality_gate.py seal electron
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stage-unit
          path: reports/
          if-no-files-found: error
          overwrite: true

  combinatorial-tests:
    name: 15,500 tracks and 100,000 query comparisons
    needs: build-and-static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/generate_synthetic_db.py
      - env:
          CUEPOINT_QA_CASES: "100000"
        run: python -m pytest -q --junitxml=reports/combinatorial-junit.xml tests/test_combinatorial_stress.py tests/test_filter_groups.py
      - run: python scripts/quality_gate.py seal combinatorial
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stage-combinatorial
          path: reports/
          if-no-files-found: error
          overwrite: true

  integration-and-ui:
    name: Electron UI integration with a synthetic library
    needs: build-and-static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run build
      - run: python tests/generate_synthetic_db.py
      - name: Verify playable Cuepoint playlist export with Playwright
        env:
          CUEPOINT_TEST_PYTHON: python
        run: |
          node tests/rekordbox-reimport.cjs reports/playlist-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path reports/playlist-export/*.png,reports/playlist-export/*.m3u8,reports/playlist-export/fixture.json `
            -DestinationPath reports/playlist-export-evidence.zip
      - env:
          CUEPOINT_CAPTURE_DIR: reports/ui-screenshots
        run: python scripts/quality_gate.py run ui -- npm run test:ui
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stage-ui
          path: |
            reports/ui-junit.xml
            reports/provenance/ui.json
            reports/ui-screenshots/
            reports/playlist-export-evidence.zip
          if-no-files-found: error
          overwrite: true

  mutation-frontend:
    name: Frontend Stryker mutation test
    needs: build-and-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python scripts/quality_gate.py run mutation-frontend -- npx --no-install stryker run
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stage-mutation-frontend
          path: reports/
          if-no-files-found: error
          overwrite: true

  mutation-python:
    name: Python AST mutation test
    needs: build-and-static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/quality_gate.py run mutation-python -- python scripts/mutate_backend.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stage-mutation-python
          path: reports/
          if-no-files-found: error
          overwrite: true

  windows-build:
    name: Windows portable build and packaged Electron smoke
    needs: build-and-static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r requirements-dev.txt
      - run: npm run package:win
      - name: Smoke-test packaged Electron application
        env:
          CUEPOINT_TEST_EXE: release/win-unpacked/Cuepoint.exe
          CUEPOINT_CAPTURE_DIR: reports/windows-screenshots
        run: |
          $portable = @(Get-ChildItem -File release/Cuepoint-*-Windows-x64.exe)
          if ($portable.Count -ne 1) { throw "Expected exactly one x64 portable binary" }
          python scripts/quality_gate.py package $portable[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CUEPOINT_TEST_PORTABLE = $portable[0].FullName
          python scripts/quality_gate.py run windows -- node tests/windows-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stage-windows
          path: reports/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: cuepoint-windows-x64-portable-candidate
          path: release/Cuepoint-*-Windows-x64.exe
          if-no-files-found: error
          overwrite: true

  quality-report:
    name: Verify and report release stages
    if: ${{ !cancelled() }}
    needs: [build-and-static, unit-and-branch-tests, combinatorial-tests, integration-and-ui,
            mutation-frontend, mutation-python, windows-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          path: reports/
          merge-multiple: true
      - run: python scripts/quality_gate.py verify --require CI_VALIDATED
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cuepoint-quality-report
          path: |
            reports/quality-gate-report.json
            reports/quality-gate-report.md
          if-no-files-found: error
          overwrite: true
